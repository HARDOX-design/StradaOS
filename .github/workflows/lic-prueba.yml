name: 2.27 (desbloqueo con donación)

# Compila la rama y prueba el desbloqueo de los temas de pago (Fase 3) en emuladores.
# Las capturas quedan en la rama «lic-capturas».
on:
  workflow_dispatch:
  push:
    branches: [ 'wip-2.27' ]
    paths-ignore: [ 'docs/**', '**.md' ]

permissions:
  contents: write

concurrency:
  group: lic
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/*.apk app-prueba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app-prueba.apk

  emulador:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 16, arch: x86, script: lic }
          - { api: 23, arch: x86, script: lic }
          - { api: 34, arch: x86_64, script: lic }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: default
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1024x600
          emulator-boot-timeout: 900
          script: bash .github/scripts/${{ matrix.script }}.sh ${{ matrix.api }} app-prueba.apk capturas/${{ matrix.script }}-api${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lic-${{ matrix.script }}-api${{ matrix.api }}
          path: capturas/

  publicar:
    needs: emulador
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lic-*
          path: out
          merge-multiple: true
      - name: Subir capturas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          echo "# Licencias · ${GITHUB_SHA::7}" > README.md
          git init -q -b lic-capturas
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas licencias (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" lic-capturas
