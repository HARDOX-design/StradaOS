name: Bloque 15 (issues y arreglos)

# Compila la rama y toma capturas de la 2.24.1: línea de tiempo, #34, #36, #37 y traducciones.
# Quedan en la rama «bloque15-capturas».
on:
  workflow_dispatch:
  push:
    branches: [ 'wip-2.24.1' ]
    paths-ignore: [ 'docs/**' ]

permissions:
  contents: write

concurrency:
  group: bloque15
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/*.apk app-prueba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app-prueba.apk

  emulador:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 16, arch: x86 }
          - { api: 23, arch: x86 }

          - { api: 34, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: default
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1024x600
          emulator-boot-timeout: 900
          script: bash .github/scripts/bloque15.sh ${{ matrix.api }} app-prueba.apk capturas/api${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bloque15-api${{ matrix.api }}
          path: capturas/

  publicar:
    needs: emulador
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bloque15-*
          path: out
          merge-multiple: true
      - name: Lista del servidor de mapas (para revisar los nombres de #34)
        continue-on-error: true
        run: |
          mkdir -p out
          for c in africa asia australia-oceania central-america europe north-america south-america russia; do
            curl -s --max-time 30 "https://download.mapsforge.org/maps/v5/$c/" | grep -o 'href="[^"?/]*\(\.map\|/\)"' | sed 's/href="//; s/"$//' > "out/servidor-$c.txt" || true
          done
      - name: Subir capturas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          echo "# Bloque 15 · ${GITHUB_SHA::7}" > README.md
          git init -q -b bloque15-capturas
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas bloque 15 (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bloque15-capturas
