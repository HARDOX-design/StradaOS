name: Regresión (todas las pantallas)

# Antes de entregar una Prueba y antes de publicar: recorre todas las pantallas, subpáginas y diálogos en Android 4.1,
# 4.2, 6 y 14 y falla si la app se cierra. Se lanza a mano (gh api …/regresion.yml/dispatches -f ref=<rama>); cada
# Android va partido en 3 trabajos en paralelo (unos 12 minutos en total).
# Capturas y pasos en la rama «regresion-capturas-<rama>».
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regresion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/*.apk app-prueba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app-prueba.apk

  emulador:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 16, arch: x86, script: regresion, part: 1 }
          - { api: 16, arch: x86, script: regresion, part: 2 }
          - { api: 16, arch: x86, script: regresion, part: 3 }
          - { api: 17, arch: x86, script: regresion, part: 1 }
          - { api: 17, arch: x86, script: regresion, part: 2 }
          - { api: 17, arch: x86, script: regresion, part: 3 }
          - { api: 23, arch: x86, script: regresion, part: 1 }
          - { api: 23, arch: x86, script: regresion, part: 2 }
          - { api: 23, arch: x86, script: regresion, part: 3 }
          - { api: 34, arch: x86_64, script: regresion, part: 1 }
          - { api: 34, arch: x86_64, script: regresion, part: 2 }
          - { api: 34, arch: x86_64, script: regresion, part: 3 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: default
          sdcard-path-or-size: 64M   # Android 4.1/4.2 sin tarjeta no tienen memoria externa (el video de prueba)
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1024x600
          emulator-boot-timeout: 900
          script: bash .github/scripts/${{ matrix.script }}.sh ${{ matrix.api }} app-prueba.apk capturas/${{ matrix.script }}-api${{ matrix.api }}-p${{ matrix.part }} ${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regresion-${{ matrix.script }}-api${{ matrix.api }}-p${{ matrix.part }}
          path: capturas/

  publicar:
    needs: emulador
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: regresion-*
          path: out
          merge-multiple: true
      - name: Subir capturas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          echo "# Regresión · ${GITHUB_SHA::7}" > README.md
          git init -q -b "regresion-capturas-${GITHUB_REF_NAME}"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas de regresión (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "regresion-capturas-${GITHUB_REF_NAME}"
      - name: ¿Se cerró la app?
        run: |
          cd out
          if ls */CIERRES.txt >/dev/null 2>&1; then
            for f in */CIERRES.txt; do echo "::error::$f"; cat "$f"; done
            exit 1
          fi
          echo "Sin cierres en ningún Android."
