name: Capturas para redes

# Manual: saca capturas de StradaOS Prueba a 2048x1200 (español/inglés, claro/oscuro, diseños del inicio) y las sube
# a la rama «capturas-<modo>» para armar las imágenes de Facebook, Reddit, X y la página.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "redes (diseños del inicio) o proyecto (una captura por función, con mapa sin conexión)"
        default: redes

permissions:
  contents: write

jobs:
  capturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar StradaOS Prueba
        run: curl -fsSL --retry 5 -o prueba.apk "https://github.com/${GITHUB_REPOSITORY}/releases/download/prueba/StradaOS-prueba.apk"
      - name: Mapa de Colombia (con caché)
        if: inputs.modo == 'proyecto'
        uses: actions/cache@v4
        with:
          path: colombia.map
          key: mapsforge-colombia-${{ github.run_id }}
          restore-keys: mapsforge-colombia-
      - name: Descargar colombia.map
        if: inputs.modo == 'proyecto'
        run: '[ -s colombia.map ] || curl -fL --retry 5 -o colombia.map https://download.mapsforge.org/maps/v5/south-america/colombia.map'
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MODO: ${{ inputs.modo }}
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1024x600
          emulator-boot-timeout: 900
          script: bash .github/scripts/capturas.sh
      - name: Subir a la rama «capturas-<modo>»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd capturas
          git init -q -b capturas
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas (${{ inputs.modo }}) de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:capturas-${{ inputs.modo }}
